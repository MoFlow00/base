name: IPTV Update

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cloakbrowser

      - name: Show Python Version
        run: python --version

      - name: Verify CloakBrowser
        run: |
          python -c "import cloakbrowser; print('CloakBrowser OK')"

      - name: Run Script
        run: python IPTV.py
