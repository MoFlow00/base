name: IPTV Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # اختياري: يعمل كل 6 ساعات

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Re-added: Important for preventing hung jobs
    
    # تأكد من السماح بالـ Write access للـ Workflow
    permissions:
      contents: write # Re-added: CRITICAL for git push to work

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # persist-credentials: true is generally not needed with contents: write permission
          # and actions/checkout@v4 handles token for push automatically.
          # If you encounter issues, you can re-add it, but it's often redundant.
          persist-credentials: true 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Using your specified version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cloakbrowser playwright

      - name: Install Playwright Browsers
        # Using 'playwright install --with-deps' is more comprehensive and often preferred
        # as it installs all necessary browsers and their system dependencies.
        run: |
          playwright install --with-deps

      - name: Run Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CLOAKBROWSER_SUPPRESS_FONT_WARNING: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          # Git config is now handled within the Python script,
          # but it doesn't hurt to have it here as well if you prefer.
          # The Python script's internal git config will take precedence for its subprocess calls.
          # git config --global user.name "GitHub Actions"
          # git config --global user.email "actions@github.com"
          python -u IPTV.py

      - name: Upload Debug Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            after_click.png
            page.html
            iptv_last_result.txt
          retention-days: 7 # Optional: Set retention for artifacts
