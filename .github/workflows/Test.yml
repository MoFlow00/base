name: IPTV Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # اختياري: يعمل كل 6 ساعات

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    # تأكد من السماح بالـ Write access للـ Workflow
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cloakbrowser playwright

      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium
          python -m playwright install-deps

      - name: Run Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CLOAKBROWSER_SUPPRESS_FONT_WARNING: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          # ضبط بيانات Git قبل تشغيل السكربت
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          python -u IPTV.py

      - name: Upload Debug Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            after_click.png
            page.html
            iptv_last_result.txt
