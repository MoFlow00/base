name: Free IPTV (GitHub Actions)

on:
  schedule:
    - cron: '0 */6 * * *'   # 每6小时运行一次
  workflow_dispatch:         # 手动触发

jobs:
  get-account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y xvfb

      - name: Install Python packages
        run: |
          pip install setuptools          # 提供 distutils
          pip install undetected-chromedriver==3.5.4   # 稳定版本
          pip install selenium

      - name: Run script with xvfb
        run: |
          xvfb-run python script.py
        continue-on-error: true   # 即使失败也继续收集 artifacts

      - name: Upload debugging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            error.png
            page_source.html
            iptv_account.txt
          if-no-files-found: ignore
