name: IPTV Auto with Minimal Profile

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xvfb and Chrome
        run: |
          sudo apt update
          sudo apt install -y xvfb

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install setuptools
          pip install undetected-chromedriver==3.5.4
          pip install selenium

      - name: Run script with xvfb
        run: |
          xvfb-run python run.py
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: iptv-account
          path: |
            iptv_account.txt
            *.png
