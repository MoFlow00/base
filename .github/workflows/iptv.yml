name: Free IPTV (GitHub Actions)

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours – adjust as needed
  workflow_dispatch:         # manual trigger

jobs:
  get-account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (xvfb, Chrome)
        run: |
          sudo apt update
          sudo apt install -y xvfb
          # Chrome is preinstalled on GitHub runners, but we can ensure it's there
          google-chrome --version

      - name: Install Python packages
        run: |
          pip install undetected-chromedriver selenium

      - name: Run script with xvfb
        run: |
          xvfb-run python script.py
        continue-on-error: true   # allow us to collect artifacts even if script fails

      - name: Upload debugging artifacts (if any)
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            error.png
            page_source.html
            iptv_account.txt
          if-no-files-found: ignore
