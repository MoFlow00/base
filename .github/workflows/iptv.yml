name: تجربة IPTV على GitHub Actions

on:
  workflow_dispatch:    # تشغيل يدوي

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تثبيت Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: تثبيت الاعتماديات (xvfb + Chrome)
        run: |
          sudo apt update
          sudo apt install -y xvfb
          google-chrome --version   # للتأكد من الإصدار

      - name: تثبيت مكتبات Python
        run: |
          pip install setuptools
          pip install undetected-chromedriver==3.5.4
          pip install selenium

      - name: تشغيل السكربت مع xvfb
        run: |
          xvfb-run python script.py
        continue-on-error: true    # نكمل حتى لو فشل السكربت

      - name: رفع المخرجات (لقطات، المصدر، النتيجة)
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            *.png
            *.html
            *.txt
          if-no-files-found: ignore
