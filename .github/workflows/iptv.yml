name: IPTV Auto Update

on:
  schedule:
    # يعمل يومياً في تمام الساعة 01:00 صباحاً بتوقيت UTC
    - cron: '0 1 * * *'
  workflow_dispatch: # يتيح لك زر "Run workflow" للتشغيل اليدوي في أي وقت

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Python Packages and Playwright Browsers
        run: |
          pip install requests cloakbrowser playwright
          playwright install chromium
          # السحر هنا: أمر رسمي يقوم بتثبيت كافة حزم النظام المطلوبة للمتصفح تلقائياً
          sudo playwright install-deps

      - name: Run IPTV Update Script inside Xvfb
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: xvfb-run -a python update_iptv.py

      - name: Push final.m3u changes to GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add final.m3u
          git commit -m "Auto update final.m3u via GitHub Actions" || echo "No changes to commit"
          git push origin main
