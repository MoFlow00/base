name: IPTV Auto (مع الملف التعريفي)

on:
  workflow_dispatch:   # تشغيل يدوي أو جدولة

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تثبيت xvfb و Chrome
        run: |
          sudo apt update
          sudo apt install -y xvfb

      - name: تثبيت Python والمكتبات
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install setuptools
          pip install undetected-chromedriver==3.5.4
          pip install selenium

      - name: فك ضغط الملف التعريفي
        run: |
          unzip -o profile.zip -d ./chrome_profile

      - name: تشغيل السكربت (مع xvfb)
        run: |
          xvfb-run python run.py
        continue-on-error: true

      - name: رفع النتائج
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: |
            iptv_account.txt
            *.png
