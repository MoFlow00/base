name: Schedule Next IPTV Run

on:
  push:
    branches:
      - main

jobs:
  schedule-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Schedule Delay Trigger via QStash
        run: |
          curl -X POST "https://qstash-us-east-1.upstash.io/v2/publish/${{ secrets.AUTOMATE_WEBHOOK_URL }}" \
               -H "Authorization: Bearer ${{ secrets.QSTASH_TOKEN }}" \
               -H "Upstash-Delay: 86400s" \
               -H "Content-Type: application/json" \
               -d '{"action": "update_iptv"}'
